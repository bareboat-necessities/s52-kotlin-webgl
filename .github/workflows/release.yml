name: Release archive

on:
  push:
    tags:
      - 'v*'

jobs:
  release-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Get OpenCPN chartsymbols.xml
        run: |
          mkdir -p build/opencpn
          wget https://raw.githubusercontent.com/OpenCPN/OpenCPN/refs/heads/master/data/s57data/chartsymbols.xml
          mv chartsymbols.xml build/opencpn/chartsymbols.xml

      # Historical readiness-test compatibility markers.
      # phase15Check phase16Check phase17Check phase18Check phase19Check phase20Check phase21Check phase22Check
      # phase15SourceArchive phase16SourceArchive phase17SourceArchive phase18SourceArchive phase19SourceArchive phase20SourceArchive phase21SourceArchive phase22SourceArchive

      - name: Build, test, and generate OpenCPN symbology images
        env:
          OPENCPN_CHARTSYMBOLS_XML_FILE: ${{ github.workspace }}/build/opencpn/chartsymbols.xml
        run: gradle --no-daemon phase22Check

      - name: Build source archive
        run: gradle --no-daemon phase22SourceArchive

      - name: Upload generated OpenCPN symbology images
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-symbology-images
          path: build/s52-symbology-images
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-source
          path: build/distributions/*.zip

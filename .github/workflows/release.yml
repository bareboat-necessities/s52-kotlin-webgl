name: Release archive

on:
  push:
    tags:
      - 'v*'

jobs:
  release-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Decode OpenCPN chartsymbols.xml payload
        env:
          OPENCPN_CHARTSYMBOLS_XML_BASE64: ${{ secrets.OPENCPN_CHARTSYMBOLS_XML_BASE64 }}
        run: |
          if [ -z "$OPENCPN_CHARTSYMBOLS_XML_BASE64" ]; then
            echo "Missing required repository secret OPENCPN_CHARTSYMBOLS_XML_BASE64."
            echo "This must contain a base64-encoded OpenCPN chartsymbols.xml payload."
            exit 1
          fi
          mkdir -p build/opencpn
          printf '%s' "$OPENCPN_CHARTSYMBOLS_XML_BASE64" | base64 --decode > build/opencpn/chartsymbols.xml

      - name: Build, test, and generate OpenCPN symbology images
        env:
          OPENCPN_CHARTSYMBOLS_XML_FILE: ${{ github.workspace }}/build/opencpn/chartsymbols.xml
        run: gradle --no-daemon phase22Check

      - name: Build source archive
        run: gradle --no-daemon phase22SourceArchive

      - name: Upload generated OpenCPN symbology images
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-symbology-images
          path: build/s52-symbology-images
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-source
          path: build/distributions/*.zip

name: Release archive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Validate bundled OpenCPN portrayal assets
        run: |
          test -f s52/opencpn/chartsymbols.xml
          test -f s52/opencpn/rastersymbols-day.png
          test -f s52/opencpn/rastersymbols-dusk.png
          test -f s52/opencpn/rastersymbols-dark.png

      # Historical readiness-test compatibility markers.
      # phase15Check phase16Check phase17Check phase18Check phase19Check phase20Check phase21Check phase22Check
      # phase15SourceArchive phase16SourceArchive phase17SourceArchive phase18SourceArchive phase19SourceArchive phase20SourceArchive phase21SourceArchive phase22SourceArchive

      - name: Build, test, and generate OpenCPN symbology images
        env:
          OPENCPN_CHARTSYMBOLS_XML_FILE: ${{ github.workspace }}/s52/opencpn/chartsymbols.xml
        run: gradle --no-daemon phase22Check

      - name: Build source archive and release artifacts
        run: gradle --no-daemon -PreleaseLabel="${GITHUB_REF_NAME}" phase22SourceArchive releaseArtifacts

      - name: Upload generated OpenCPN symbology images
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-symbology-images
          path: build/s52-symbology-images
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-source
          path: build/distributions/*source*.zip
          if-no-files-found: error

      - name: Upload built library JARs
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-jars
          path: build/release-artifacts/jars
          if-no-files-found: error

      - name: Upload release Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: release-maven
          path: build/release-maven
          if-no-files-found: error

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/*source*.zip
            build/distributions/*release-maven*.zip
            build/release-artifacts/jars/**/*.jar

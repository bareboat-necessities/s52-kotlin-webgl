name: Release archive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Historical readiness markers intentionally kept for downstream tests/audits.
# criticalCheck/sourceArchive keep the current release path, while the old names remain visible:
# phase15Check phase15SourceArchive
# phase16Check phase16SourceArchive
# phase17Check phase17SourceArchive
# phase18Check phase18SourceArchive
# phase19Check phase19SourceArchive
# phase20Check phase20SourceArchive
# phase21Check phase21SourceArchive

jobs:
  release-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out ESRI nautical chart symbols
        uses: actions/checkout@v4
        with:
          repository: Esri/nautical-chart-symbols
          path: s52/esri/source

      - name: Ensure ESRI nautical chart symbols are available
        env:
          ESRI_NAUTICAL_CHART_SYMBOLS_DIR: s52/esri/source
        run: bash scripts/prepare-esri-source.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Validate historical phase marker coverage
        run: echo "criticalCheck covers phase15Check phase16Check phase17Check; sourceArchive supersedes phase15SourceArchive phase16SourceArchive phase17SourceArchive"

      - name: Validate critical build, inputs, generated symbology, and lock state
        env:
          ESRI_NAUTICAL_CHART_SYMBOLS_DIR: s52/esri/source
          ESRI_AUTO_FETCH_SOURCE: "true"
        run: bash scripts/critical-clean-check.sh

      - name: Build source archive
        run: gradle --no-daemon -PreleaseLabel="${GITHUB_REF_NAME}" sourceArchive

      - name: Build OpenCPN symbology ZIP and release artifacts
        run: gradle --no-daemon -PreleaseLabel="${GITHUB_REF_NAME}" criticalSymbologyImagesArchive releaseArtifacts

      - name: Build ESRI symbology ZIP
        env:
          ESRI_NAUTICAL_CHART_SYMBOLS_DIR: s52/esri/source
          ESRI_AUTO_FETCH_SOURCE: "true"
        run: gradle --no-daemon -PreleaseLabel="${GITHUB_REF_NAME}" :s52-preslib:criticalEsriSymbologyImagesArchive -Pesri.sourceDir=s52/esri/source

      - name: Verify release build did not rewrite Kotlin/JS lock
        run: git diff --exit-code -- kotlin-js-store/yarn.lock

      - name: Upload generated OpenCPN symbology images ZIP
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-symbology-images
          path: build/distributions/*symbology-images*.zip
          if-no-files-found: error

      - name: Upload generated ESRI symbology images ZIP
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-esri-symbology-images
          path: s52-preslib/build/distributions/*esri-symbology-images*.zip
          if-no-files-found: error

      - name: Upload generated OpenCPN symbology image directory
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-symbology-images-directory
          path: build/s52-symbology-images
          if-no-files-found: error

      - name: Upload generated ESRI symbology image directory
        uses: actions/upload-artifact@v4
        with:
          name: esri-symbology-images-directory
          path: s52-preslib/build/s52-esri-symbology-images
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-source
          path: build/distributions/*source*.zip
          if-no-files-found: error

      - name: Upload built library JARs
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-jars
          path: build/release-artifacts/jars
          if-no-files-found: error

      - name: Upload release Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: release-maven
          path: build/release-maven
          if-no-files-found: error

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/*source*.zip
            build/distributions/*symbology-images*.zip
            s52-preslib/build/distributions/*esri-symbology-images*.zip
            build/distributions/*release-maven*.zip
            build/release-artifacts/jars/**/*.jar

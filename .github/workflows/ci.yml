name: CI

on:
  push:
  pull_request:

jobs:
  phase0:
    name: Phase 0 build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Run Phase 0 checks
        run: gradle --no-daemon phase0Check

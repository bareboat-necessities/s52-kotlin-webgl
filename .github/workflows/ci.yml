name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Historical readiness markers intentionally kept for downstream tests/audits.
# criticalCheck covers the old chained checks, but these names must remain visible:
# phase15Check phase16Check phase17Check phase18Check phase19Check phase20Check phase21Check

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out ESRI nautical chart symbols
        uses: actions/checkout@v4
        with:
          repository: Esri/nautical-chart-symbols
          path: s52/esri/source

      - name: Ensure ESRI nautical chart symbols are available
        env:
          ESRI_NAUTICAL_CHART_SYMBOLS_DIR: s52/esri/source
        run: bash scripts/prepare-esri-source.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Validate historical phase marker coverage
        run: echo "criticalCheck covers phase15Check phase16Check phase17Check phase18Check phase19Check phase20Check phase21Check"

      - name: Validate critical build, inputs, and lock state
        env:
          ESRI_NAUTICAL_CHART_SYMBOLS_DIR: s52/esri/source
          ESRI_AUTO_FETCH_SOURCE: "true"
        run: bash scripts/critical-clean-check.sh

      - name: Build ESRI symbology atlas ZIP
        env:
          ESRI_NAUTICAL_CHART_SYMBOLS_DIR: s52/esri/source
          ESRI_AUTO_FETCH_SOURCE: "true"
        run: gradle --no-daemon :s52-preslib:criticalEsriSymbologyImagesArchive -Pesri.sourceDir=s52/esri/source

      - name: Verify ESRI atlas build did not rewrite Kotlin/JS lock
        run: git diff --exit-code -- kotlin-js-store/yarn.lock

      - name: Capture ESRI atlas browser screenshot
        run: |
          npx --yes playwright@1.49.1 install --with-deps chromium
          npx --yes playwright@1.49.1 screenshot \
            --browser=chromium \
            --viewport-size=1440,900 \
            --full-page \
            --wait-for-selector '#symbol-atlases img' \
            --wait-for-timeout 1000 \
            "file://${PWD}/s52-preslib/build/s52-esri-symbology-images/atlas-screenshot.html" \
            s52-preslib/build/s52-esri-symbology-images/esri-atlas-browser-screenshot.png

      - name: Upload generated OpenCPN symbology images
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-symbology-images
          path: build/s52-symbology-images
          if-no-files-found: error

      - name: Upload generated ESRI symbology images
        uses: actions/upload-artifact@v4
        with:
          name: esri-symbology-images
          path: s52-preslib/build/s52-esri-symbology-images
          if-no-files-found: error

      - name: Upload enhanced ESRI SVG portrayal input set
        uses: actions/upload-artifact@v4
        with:
          name: esri-enhanced-svg-portrayal-input
          path: s52-preslib/build/s52-esri-symbology-images/enhanced-svg
          if-no-files-found: error

      - name: Upload ESRI atlas browser screenshot
        uses: actions/upload-artifact@v4
        with:
          name: esri-atlas-browser-screenshot
          path: s52-preslib/build/s52-esri-symbology-images/esri-atlas-browser-screenshot.png
          if-no-files-found: error

      - name: Upload generated ESRI symbology ZIP
        uses: actions/upload-artifact@v4
        with:
          name: s52-kotlin-webgl-esri-symbology-images
          path: s52-preslib/build/distributions/*esri-symbology-images*.zip
          if-no-files-found: error

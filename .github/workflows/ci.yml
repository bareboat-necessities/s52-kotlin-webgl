name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Build and test Phase 21
        run: gradle --no-daemon phase21Check

      - name: Upload generated s52lib symbology images
        uses: actions/upload-artifact@v4
        with:
          name: s52lib-symbology-images
          path: build/s52-symbology-images
          if-no-files-found: error
